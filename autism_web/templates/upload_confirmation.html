<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoDetect AI – Video Analysis Complete</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #0d9488 50%, #0284c7 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --primary: #0d9488;
            --secondary: #0284c7;
            --dark-text: #0f172a;
            --muted-text: #475569;
            --shadow-lg: 0 25px 50px -12px rgba(15, 23, 42, 0.25);
            --radius-lg: 24px;
            --radius-md: 14px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            color: var(--dark-text);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 16px;
        }

        .container {
            max-width: 720px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            padding: 40px;
            box-shadow: var(--shadow-lg);
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: #dcfce7;
            color: #16a34a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 20px auto;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            color: var(--dark-text);
            margin-bottom: 10px;
        }

        p {
            font-size: 0.98rem;
            color: var(--muted-text);
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .msg-box {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: var(--radius-md);
            padding: 20px;
            font-weight: 700;
            color: #15803d;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-view {
            padding: 16px 36px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            text-decoration: none;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 1.05rem;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 20px -5px rgba(13, 148, 136, 0.4);
            transition: all 0.25s ease;
        }

        .btn-view:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(13, 148, 136, 0.5);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="success-icon">
            <i class="fa-solid fa-check"></i>
        </div>

        <h1>Video Neural Analysis Complete!</h1>
        <p>Thank you, <strong>{{ parent_name }}</strong>. The video for <strong>{{ child_name }}</strong> has been successfully processed by our MobileNetV2 + LSTM model.</p>

        {% if upload_message %}
        <div class="msg-box">
            <i class="fa-solid fa-circle-check"></i> {{ upload_message }}
        </div>
        {% endif %}

        <a href="/combined-results" class="btn-view">
            <span>View Comprehensive Multi-Modal Diagnostic Report</span>
            <i class="fa-solid fa-arrow-right"></i>
        </a>
    </div>

</body>
</html>
