<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoDetect AI – Step {{ current_step }} of {{ total_steps }}: {{ step_title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #0d9488 50%, #0284c7 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --primary: #0d9488;
            --secondary: #0284c7;
            --dark-text: #0f172a;
            --muted-text: #475569;
            --shadow-lg: 0 25px 50px -12px rgba(15, 23, 42, 0.25);
            --radius-lg: 24px;
            --radius-md: 14px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            color: var(--dark-text);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 16px;
        }

        .container {
            max-width: 820px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            padding: 40px;
            box-shadow: var(--shadow-lg);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .step-header { margin-bottom: 28px; }

        .step-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(13, 148, 136, 0.1);
            color: var(--primary);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .step-title {
            font-size: 1.85rem;
            font-weight: 800;
            color: var(--dark-text);
            margin-bottom: 16px;
        }

        .progress-bar-container {
            width: 100%;
            background-color: #e2e8f0;
            border-radius: 50px;
            height: 10px;
            overflow: hidden;
            position: relative;
            margin-bottom: 30px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 50px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .question-card {
            background: #ffffff;
            border: 1.5px solid #e2e8f0;
            border-radius: var(--radius-md);
            padding: 22px;
            margin-bottom: 20px;
            transition: all 0.25s ease;
        }

        .question-card:hover {
            border-color: var(--primary);
            box-shadow: 0 10px 20px -5px rgba(13, 148, 136, 0.1);
        }

        .question-text {
            font-size: 1.02rem;
            font-weight: 700;
            color: var(--dark-text);
            line-height: 1.5;
            margin-bottom: 16px;
        }

        .options-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .option-pill { position: relative; }

        .option-pill input[type="radio"] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .option-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 13px 20px;
            background: #f8fafc;
            border: 1.5px solid #cbd5e1;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--muted-text);
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .option-pill input[type="radio"]:checked + .option-label {
            background: rgba(13, 148, 136, 0.1);
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
        }

        .option-label:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 32px;
            gap: 16px;
        }

        .btn-secondary {
            padding: 14px 28px;
            background: #f1f5f9;
            color: var(--muted-text);
            text-decoration: none;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
            color: var(--dark-text);
        }

        .btn-primary {
            padding: 14px 36px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 1rem;
            font-family: inherit;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 20px -5px rgba(13, 148, 136, 0.4);
            transition: all 0.25s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(13, 148, 136, 0.5);
        }

        @media (max-width: 600px) {
            .container { padding: 24px 16px; }
            .options-row { grid-template-columns: 1fr; }
            .nav-buttons { flex-direction: column-reverse; }
            .btn-primary, .btn-secondary { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="step-header">
            <div class="step-badge">
                <i class="fa-solid fa-list-check"></i> Step {{ current_step }} of {{ total_steps }}
            </div>
            <h1 class="step-title">{{ step_title }}</h1>
            
            <div class="progress-bar-container">
                <div class="progress-bar" style="width: {{ (current_step / total_steps * 100) | round }}%;"></div>
            </div>
        </div>

        <form id="questionnaire-form">
            {% for q_key, q_data in questions.items() %}
            <div class="question-card">
                <div class="question-text">{{ q_data.question }}</div>
                
                <div class="options-row">
                    <div class="option-pill">
                        <input type="radio" id="{{ q_key }}_yes" name="{{ q_key }}" value="yes" required>
                        <label for="{{ q_key }}_yes" class="option-label">
                            <i class="fa-solid fa-check-circle"></i> Yes
                        </label>
                    </div>

                    <div class="option-pill">
                        <input type="radio" id="{{ q_key }}_no" name="{{ q_key }}" value="no" required>
                        <label for="{{ q_key }}_no" class="option-label">
                            <i class="fa-solid fa-times-circle"></i> No
                        </label>
                    </div>
                </div>
            </div>
            {% endfor %}

            <div class="nav-buttons">
                <a href="/questionnaire-step/{{ current_step - 1 }}" class="btn-secondary">
                    <i class="fa-solid fa-arrow-left"></i> Previous Step
                </a>

                <button type="submit" class="btn-primary">
                    <span>Calculate Results</span>
                    <i class="fa-solid fa-calculator"></i>
                </button>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('questionnaire-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const form = e.target;
            const formData = new FormData(form);
            const jsonData = {};

            formData.forEach((value, key) => {
                jsonData[key] = value;
            });

            try {
                const response = await fetch('/submit-step/{{ current_step }}', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(jsonData)
                });
                const result = await response.json();

                if (response.ok && result.status === 'ok') {
                    window.location.href = result.redirect_url;
                } else {
                    alert('Error submitting answers: ' + (result.message || 'Please try again.'));
                }
            } catch (error) {
                console.error('Submission error:', error);
                alert('Connection error. Please try again.');
            }
        });

        // Pre-fill previous answers
        document.addEventListener('DOMContentLoaded', () => {
            const allAnswers = {{ all_answers | tojson }};
            if (allAnswers) {
                for (const key in allAnswers) {
                    const val = allAnswers[key];
                    const radio = document.querySelector(`input[name="${key}"][value="${val}"]`);
                    if (radio) {
                        radio.checked = true;
                    }
                }
            }
        });
    </script>
</body>
</html>
