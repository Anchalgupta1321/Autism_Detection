<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoDetect AI – Behavioral Patterns & Sensory Sensitivities (Step 3/5)</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            margin: 0;
            padding: 20px;
            background: url('https://www.transparenttextures.com/patterns/paper-fibers.png') repeat, linear-gradient(to bottom right, #e6f5ff, #f3fcff);
            background-blend-mode: overlay;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }
        .container {
            max-width: 800px; /* Wider to accommodate more questions */
            margin: auto;
            background: #fff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 100%;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: #2c3e50;
            font-size: 2.5em;
            margin-bottom: 30px;
            font-weight: 700;
            text-align: center;
        }

        .progress-bar-container {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 10px;
            margin-bottom: 40px;
            overflow: hidden;
            height: 12px;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 60%; /* 3 out of 5 steps = 60% */
            background-color: #00b894; /* Green */
            border-radius: 10px;
            color: white;
            transition: width 0.5s ease-in-out;
        }

        .progress-text {
            position: absolute;
            width: 100%;
            top: 0;
            left: 0;
            font-size: 0.8em;
            font-weight: 600;
            line-height: 12px;
            color: #333;
            text-align: center;
            user-select: none;
        }

        form {
            text-align: left;
        }

        .question-group {
            margin-bottom: 25px;
            border: 1px solid #f0f0f0;
            border-radius: 10px;
            padding: 20px;
            background-color: #fdfdfd;
            transition: box-shadow 0.3s ease, transform 0.3s ease;
        }

        .question-group:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            transform: translateY(-3px);
        }

        .question-group label {
            display: block;
            margin-bottom: 15px;
            font-weight: 600;
            color: #333;
            font-size: 1.1em;
            line-height: 1.4;
        }

        .question-group select {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1em;
            box-sizing: border-box;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23007bff%22%20d%3D%22M287%2069.9a14.7%2014.7%200%200%200-20.8%200L146.2%20190.3%2026.3%2069.9A14.7%2014.7%200%200%200%205.5%2090.7l128.8%20128.8c5.7%205.7%2014.8%205.7%2020.5%200L287%2090.7a14.7%2014.7%200%200%200%200-20.8z%22%2F%3E%3C%2Fsvg%3E');
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 12px;
            cursor: pointer;
            transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.2s ease;
        }

        .question-group select:hover {
            transform: scale(1.005);
        }

        .question-group select:focus {
            border-color: #00aaff;
            box-shadow: 0 0 8px rgba(0, 170, 255, 0.4);
            outline: none;
            transform: scale(1.005);
        }

        input[type="submit"] {
            margin-top: 30px;
            background-color: #00b894;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1em;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 184, 148, 0.2);
        }

        input[type="submit"]:hover {
            background-color: #009f7a;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 184, 148, 0.3);
        }

        input[type="submit"]:active {
            transform: translateY(0);
            box-shadow: 0 4px 10px rgba(0, 184, 148, 0.2);
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }
            h1 {
                font-size: 2em;
            }
            .progress-bar-container {
                margin-bottom: 30px;
            }
            .question-group {
                padding: 15px;
            }
            .question-group label {
                font-size: 1em;
            }
            input[type="submit"] {
                padding: 12px 20px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Behavioral Patterns and Sensory Sensitivities</h1>

        <div class="progress-bar-container">
            <div class="progress-bar" style="width: 60%;"></div>
            <div class="progress-text">Step 3 of 5</div>
        </div>

        <form id="questionnaire-form">
            <input type="hidden" name="child_name" value="{{ child_name }}">
            <input type="hidden" name="age" value="{{ age }}">
            <input type="hidden" name="gender" value="{{ gender }}">
            <input type="hidden" name="parent_name" value="{{ parent_name }}">
            <input type="hidden" name="parent_email" value="{{ parent_email }}">
            <input type="hidden" name="q1_social_interact" value="{{ q1_social_interact_ans }}">
            <input type="hidden" name="q2_respond_name" value="{{ q2_respond_name_ans }}">
            <input type="hidden" name="q3_smile_back" value="{{ q3_smile_back_ans }}">
            <input type="hidden" name="q4_eye_contact" value="{{ q4_eye_contact_ans }}">
            <input type="hidden" name="q5_interested_peers" value="{{ q5_interested_peers_ans }}">
            <input type="hidden" name="q6_show_to_share" value="{{ q6_show_to_share_ans }}">
            <input type="hidden" name="q7_follow_gaze" value="{{ q7_follow_gaze_ans }}">
            <input type="hidden" name="q8_get_attention" value="{{ q8_get_attention_ans }}">
            <input type="hidden" name="q9_social_referencing" value="{{ q9_social_referencing_ans }}">
            <input type="hidden" name="q10_point_request" value="{{ q10_point_request_ans }}">
            <input type="hidden" name="q11_point_show" value="{{ q11_point_show_ans }}">
            <input type="hidden" name="q12_imitate_wave_clap" value="{{ q12_imitate_wave_clap_ans }}">
            <input type="hidden" name="q13_8_words" value="{{ q13_8_words_ans }}">
            <input type="hidden" name="q14_follow_instructions" value="{{ q14_follow_instructions_ans }}">
            <input type="hidden" name="q15_to_and_fro_conv" value="{{ q15_to_and_fro_conv_ans }}">
            <input type="hidden" name="q16_echolalia" value="{{ q16_echolalia_ans }}">
            <input type="hidden" name="p1_play_pretend" value="{{ p1_play_pretend_ans }}">
            <input type="hidden" name="p2_play_small_toys" value="{{ p2_play_small_toys_ans }}">
            <input type="hidden" name="p3_copy_you" value="{{ p3_copy_you_ans }}">
            <input type="hidden" name="p4_play_doll" value="{{ p4_play_doll_ans }}">
            <input type="hidden" name="p5_play_imaginatively_others" value="{{ p5_play_imaginatively_others_ans }}">


            <div class="question-group">
                <label for="b_hearing_problem">1. 👂 Have you ever wondered if your child might have a hearing problem?</label>
                <select name="b_hearing_problem" id="b_hearing_problem" required data-red-flag="yes">
                    <option value="">-- Select --</option>
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                </select>
            </div>

            <div class="question-group">
                <label for="b_upset_noises">2. 😖 Does your child get upset by everyday noises (e.g., screaming or crying at a vacuum cleaner or loud music)?</label>
                <select name="b_upset_noises" id="b_upset_noises" required data-red-flag="yes">
                    <option value="">-- Select --</option>
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                </select>
            </div>

            <div class="question-group">
                <label for="b_finger_movements">3. 🖐️👁️ Does your child make unusual finger movements near his or her eyes (e.g., wiggling fingers close to their eyes)?</label>
                <select name="b_finger_movements" id="b_finger_movements" required data-red-flag="yes">
                    <option value="">-- Select --</option>
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                </select>
            </div>

            <div class="question-group">
                <label for="b_line_up_toys">4. 🧱➡️ Does your child line up toys or other objects in a very specific order?</label>
                <select name="b_line_up_toys" id="b_line_up_toys" required data-red-flag="yes">
                    <option value="">-- Select --</option>
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                </select>
            </div>

            <div class="question-group">
                <label for="b_repetitive_movements">5. 🌀 Does your child have any unusual and repetitive movements (e.g., hand flapping, spinning)?</label>
                <select name="b_repetitive_movements" id="b_repetitive_movements" required data-red-flag="yes">
                    <option value="">-- Select --</option>
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                </select>
            </div>

            <div class="question-group">
                <label for="b_parts_of_toy">6. ⚙️ Does your child seem unusually interested in parts of a toy or object (e.g., spinning the wheels of a car) rather than using the object as it was intended?</label>
                <select name="b_parts_of_toy" id="b_parts_of_toy" required data-red-flag="yes">
                    <option value="">-- Select --</option>
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                </select>
            </div>

            <div class="question-group">
                <label for="b_upset_routines">7. 🗓️😡 Is your child very particular about routines and gets upset if they are changed?</label>
                <select name="b_upset_routines" id="b_upset_routines" required data-red-flag="yes">
                    <option value="">-- Select --</option>
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                </select>
            </div>

            <div class="question-group">
                <label for="b_stare_wander">8. 💭🚶 Does your child stare at nothing or wander with no purpose for periods of time?</label>
                <select name="b_stare_wander" id="b_stare_wander" required data-red-flag="yes">
                    <option value="">-- Select --</option>
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                </select>
            </div>

            <div class="question-group">
                <label for="b_unusual_interests">9. 🌟🧠 Does your child have any strong, unusual interests that seem to preoccupy them (e.g., traffic lights, drainpipes)?</label>
                <select name="b_unusual_interests" id="b_unusual_interests" required data-red-flag="yes">
                    <option value="">-- Select --</option>
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                </select>
            </div>

            <div class="question-group">
                <label for="b_sensitive_touch">10. ✋😬 Does your child seem overly sensitive to touch (e.g., during dressing, bathing, or hugs)?</label>
                <select name="b_sensitive_touch" id="b_sensitive_touch" required data-red-flag="yes">
                    <option value="">-- Select --</option>
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                </select>
            </div>

            <div class="question-group">
                <label for="b_enjoy_movement">11. 🎢 Does your child enjoy being swung, bounced on your knee, or other movement activities?</label>
                <select name="b_enjoy_movement" id="b_enjoy_movement" required data-red-flag="no">
                    <option value="">-- Select --</option>
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                </select>
            </div>

            <input type="submit" value="Next">
        </form>
    </div>
    <script>
        document.getElementById('questionnaire-form').addEventListener('submit', async function (e) {
	    e.preventDefault();
            const formData = new FormData(e.target);
            const jsonData = {};
	    formData.forEach((value, key) => jsonData[key] = value);

            try {
                const response = await fetch('/submit-step/3', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(jsonData)
                });

                const result = await response.json();
                if (response.ok && result.status === 'ok') {
                    window.location.href = result.redirect_url;
                } else {
                    alert(`Failed: ${result.message || "Unknown error"}`);
                }
           } catch (err) {
                console.error('Submission error:', err);
                alert("Submission failed. Check your connection.");
           }
        
        });
 	
	document.addEventListener('DOMContentLoaded', () => {
	    const allAnswers = {{ all_answers | tojson }};
	    for (const key in allAnswers) {
		const el = document.getElementsByName(key)[0];
		if (el && el.tagName === 'SELECT') {
		    el.value = allAnswers[key];
		}
	    }
	});
    </script>
</body>
</html>
